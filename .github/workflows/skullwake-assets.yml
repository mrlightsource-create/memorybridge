name: Skullwake 3D asset package

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/skullwake-assets.yml'
      - 'tmp/skullwake-asset-links.md'

permissions:
  contents: read

jobs:
  full-quaternius-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download official Quaternius Pirate Kit folder
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet gdown
          mkdir -p /tmp/piratekit
          gdown --folder --no-cookies \
            'https://drive.google.com/drive/folders/1KjMzhVsDcyvYMWeVjZcRfuu8auBLpNi2?usp=sharing' \
            -O /tmp/piratekit
          echo '--- DOWNLOADED FILES ---'
          find /tmp/piratekit -maxdepth 5 -type f -printf '%p %s bytes\n' | sort
          mkdir -p skullwake-quaternius-pirate-kit
          find /tmp/piratekit -type f \( -iname '*gltf*' -o -iname '*.glb' -o -iname '*.zip' -o -iname '*.png' -o -iname '*.jpg' \) -print0 | \
            xargs -0 -r -I{} cp --parents '{}' skullwake-quaternius-pirate-kit/
          cat > skullwake-quaternius-pirate-kit/LICENSE.txt <<'EOF'
          Quaternius Pirate Kit
          Official source: https://quaternius.com/packs/piratekit.html
          Download folder: https://drive.google.com/drive/folders/1KjMzhVsDcyvYMWeVjZcRfuu8auBLpNi2
          License: CC0 1.0 Universal
          EOF
      - name: Upload full single-pack source
        uses: actions/upload-artifact@v4
        with:
          name: skullwake-quaternius-pirate-kit
          path: skullwake-quaternius-pirate-kit
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
