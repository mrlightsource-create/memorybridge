name: Skullwake 3D asset package

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/skullwake-assets.yml'
      - 'tmp/skullwake-asset-links.md'

permissions:
  contents: read

jobs:
  inspect-downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Quaternius and Creatus download endpoints
        shell: bash
        run: |
          set -euxo pipefail
          curl -A 'Mozilla/5.0' -L --fail -o /tmp/poly.html 'https://poly.pizza/bundle/Pirate-kit-0q5ulmIYqQ'
          echo '--- POLY URLS ---'
          grep -Eoi 'https?[^"<> ]+' /tmp/poly.html | sed 's/&amp;/\&/g' | grep -Ei 'download|gltf|glb|zip|bundle|static' | head -200 || true
          echo '--- POLY DOWNLOAD CONTEXT ---'
          grep -Ein 'download|gltf|zip|0q5ulmIYqQ' /tmp/poly.html | head -200 || true
          curl -A 'Mozilla/5.0' -L --fail -o /tmp/itch.html 'https://creatus.itch.io/creatus-pirate/purchase'
          echo '--- ITCH CONTEXT ---'
          grep -Ein 'download|upload|file|Creatus_Pack_Pirate' /tmp/itch.html | head -200 || true
