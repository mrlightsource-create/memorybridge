name: Temporary Feral Verdure materialization bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/feral-verdure-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-feral-verdure-materialization
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and independently verify the exact release bytes
        env:
          EXPECTED_SHA256: 4d23a67c9ef28d2662570cd13573437178918e69e369ba37349b8a535aee5d7a
          SIGNED_URL: https://release-assets.githubusercontent.com/github-production-release-asset/1239456625/87fecc25-5c57-4d41-8019-0d39d5709017?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-13T05%3A04%3A13Z&rscd=attachment%3B+filename%3DFeral_Verdure_Native_macOS.zip&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-13T04%3A04%3A04Z&ske=2026-08-13T05%3A04%3A13Z&sks=b&skv=2018-11-09&sig=ZWPide1Sch9vGU5fV5SWfntk6pU6yqeisBeKbE9Fr8E%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4NjU5NjQ2OSwibmJmIjoxNzg2NTk0NjY5LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.r71KxQf0q9wd1cW5c8W6Tl24E4i-Sn_sx3zjYT3y9aw&response-content-disposition=attachment%3B%20filename%3DFeral_Verdure_Native_macOS.zip&response-content-type=application%2Foctet-stream
        run: |
          mkdir -p delivery
          curl --fail --location --retry 5 --retry-delay 2 "$SIGNED_URL" \
            --output delivery/Feral_Verdure_Native_macOS.zip
          APP=delivery/Feral_Verdure_Native_macOS.zip
          test -s "$APP"
          ACTUAL_SHA256=$(sha256sum "$APP" | awk '{print $1}')
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          unzip -tq "$APP"
          unzip -l "$APP" > delivery/macos_zip_listing.txt
          grep -q 'Contents/MacOS/' delivery/macos_zip_listing.txt
          if grep -Eiq '\.(html|js|mjs|wasm)([[:space:]]|$)' delivery/macos_zip_listing.txt; then
            echo 'Browser runtime detected in verified release bytes.' >&2
            exit 1
          fi
          printf '%s  %s\n' "$ACTUAL_SHA256" 'Feral_Verdure_Native_macOS.zip' > delivery/SHA256.txt

      - name: Upload the one-day materialization artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feral-Verdure-Native-Materialization
          path: delivery
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
